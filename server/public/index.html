<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0f13">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>TV Control</title>
<style>
  :root{--bg:#0e0f13;--card:#181a21;--line:#272a35;--fg:#e8e9ee;--mut:#8b91a1;--acc:#6aa7ff;--ok:#4cd28a;--bad:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overscroll-behavior:none}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex;gap:8px;padding:10px 12px;align-items:center}
  #dot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}
  #dot.on{background:var(--ok)} #dot.wait{background:#f2c14e}
  #url{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:15px}
  button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
  button:active{background:#22252f} button.p{background:var(--acc);color:#07111f;border-color:var(--acc);font-weight:600}
  nav{display:flex;border-bottom:1px solid var(--line)}
  nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);padding:12px}
  nav button.a{color:var(--fg);box-shadow:inset 0 -2px var(--acc)}
  main{flex:1;overflow:auto;padding:12px}
  .tab{display:none} .tab.a{display:block}
  #pad{height:34vh;min-height:190px;background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--mut);touch-action:none;user-select:none;text-align:center;font-size:13px;padding:8px}
  .row{display:flex;gap:8px;margin-top:10px} .row>*{flex:1}
  .lbl{margin:14px 0 2px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  input[type=range]{width:100%;accent-color:var(--acc);margin:8px 0 0}
  #times{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
  .item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
  .item .t{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;font-size:15px}
  .item .t small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .x{flex:none;color:var(--bad);padding:6px 10px}
  #frame{width:100%;border-radius:12px;background:#000;aspect-ratio:16/9;object-fit:contain;display:block}
  #info{margin-top:10px;color:var(--mut);font-size:13px;word-break:break-all}
  #login{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;gap:12px;justify-content:center;padding:28px;z-index:9}
  #login h2{margin:0 0 4px} #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:20px;display:none;font-size:14px}
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <input id="url" placeholder="Pega un enlace o escribe para buscar" inputmode="url" autocapitalize="off" autocomplete="off">
  <button id="go" class="p">Ir</button>
</header>
<nav>
  <button data-tab="remote" class="a">Mando</button>
  <button data-tab="lib">Biblioteca</button>
  <button data-tab="screen">Pantalla</button>
</nav>
<main>
  <section id="remote" class="tab a">
    <div id="pad">Trackpad<br>1 dedo: mover · toque: clic · 2 dedos: scroll</div>
    <div class="row">
      <button data-nav="back">◀ Atrás</button><button data-nav="forward">Adelante ▶</button>
      <button data-nav="reload">⟳</button><button data-nav="home">⌂</button>
    </div>
    <div class="lbl">Reproducción</div>
    <input id="seek" type="range" min="0" max="0" value="0" step="1">
    <div id="times"><span id="tpos">0:00</span><span id="tdur">0:00</span></div>
    <div class="row">
      <button data-seek="-60">−60</button><button data-seek="-10">−10</button>
      <button id="pp" class="p">⏯</button>
      <button data-seek="10">+10</button><button data-seek="60">+60</button>
    </div>
    <div class="row">
      <button data-vol="down">Vol −</button><button id="mute">Silencio</button><button data-vol="up">Vol +</button>
      <button id="fs">Pantalla completa</button>
    </div>
    <div class="row">
      <button data-speed="1">1x</button><button data-speed="1.25">1.25x</button>
      <button data-speed="1.5">1.5x</button><button data-speed="2">2x</button>
    </div>
    <div class="lbl">Teclado</div>
    <div class="row">
      <input id="txt" style="flex:3;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:15px" placeholder="Texto para el campo activo en la TV" autocomplete="off">
      <button id="sendtxt">Enviar</button>
    </div>
    <div class="row">
      <button data-key="Enter">⏎</button><button data-key="Backspace">⌫</button>
      <button data-key="Escape">Esc</button><button data-key="Tab">Tab</button>
      <button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button>
    </div>
    <div class="row">
      <button id="desk">Modo escritorio: sí</button>
      <button id="addcur">+ Guardar página actual</button>
    </div>
  </section>

  <section id="lib" class="tab">
    <div class="row" style="margin-top:0"><input id="ltitle" style="flex:1;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:15px" placeholder="Título (ej. Clase 3 – Inglés)"></div>
    <div class="row"><input id="lurl" style="flex:1;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:15px" placeholder="Enlace" inputmode="url" autocapitalize="off"><button id="ladd" class="p" style="flex:none">Guardar</button></div>
    <div id="list"></div>
  </section>

  <section id="screen" class="tab">
    <img id="frame" alt="Pantalla de la TV">
    <div id="info"></div>
    <p style="color:var(--mut);font-size:12px">La captura puede verse negra mientras un video corre en pantalla completa (limitación de Android); el título y el progreso siguen siendo reales.</p>
  </section>
</main>

<div id="login">
  <h2>TV Control</h2>
  <input id="tok" type="password" placeholder="Token del servidor" style="background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px;font-size:16px">
  <button id="tokok" class="p">Entrar</button>
</div>
<div id="toast"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
let token = localStorage.getItem('tok') || '';
let ws = null, opened = false, fails = 0, tab = 'remote', pending = null, lib = [], state = {}, desktop = true, seeking = false;

function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 1800); }
function setDot(c) { $('#dot').className = c; }
const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function connect() {
  if (!token) { $('#login').style.display = 'flex'; return; }
  $('#login').style.display = 'none';
  opened = false;
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=ctl&token=${encodeURIComponent(token)}`);
  ws.onopen = () => { opened = true; fails = 0; setDot('wait'); if (tab === 'screen') send({ type: 'watch', on: true }); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'hello') { setDot(m.tv ? 'on' : 'wait'); state = m.state || {}; lib = m.library || []; renderLib(); renderState(); if (pending && m.tv) { send(pending); pending = null; } }
    else if (m.type === 'tv') { setDot(m.online ? 'on' : 'wait'); if (m.online && pending) { send(pending); pending = null; } }
    else if (m.type === 'state') { state = m; renderState(); }
    else if (m.type === 'frame') { $('#frame').src = 'data:image/jpeg;base64,' + m.data; }
    else if (m.type === 'library') { lib = m.items; renderLib(); }
    else if (m.type === 'error' && m.error === 'tv_offline') toast('La TV está desconectada');
  };
  ws.onclose = () => {
    setDot('');
    if (!opened && ++fails >= 3) { localStorage.removeItem('tok'); token = ''; fails = 0; toast('Token incorrecto'); }
    setTimeout(connect, 1500);
  };
}
function send(o) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));
  else if (o.type === 'open') pending = o;
}

// ---- Login ----
$('#tokok').onclick = () => { token = $('#tok').value.trim(); if (token) { localStorage.setItem('tok', token); connect(); } };

// ---- Abrir URL ----
const openUrl = (u) => { u = (u || '').trim(); if (!u) return; send({ type: 'open', url: u }); toast('Enviado a la TV'); };
$('#go').onclick = () => { openUrl($('#url').value); $('#url').blur(); };
$('#url').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#go').click(); });

// ---- Pestañas ----
$$('nav button').forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  $$('nav button').forEach((x) => x.classList.toggle('a', x === b));
  $$('.tab').forEach((x) => x.classList.toggle('a', x.id === tab));
  send({ type: 'watch', on: tab === 'screen' });
});
document.addEventListener('visibilitychange', () => { if (document.hidden) send({ type: 'watch', on: false }); else send({ type: 'watch', on: tab === 'screen' }); });

// ---- Trackpad ----
(() => {
  const pad = $('#pad');
  let last = null, t0 = 0, moved = 0, maxFingers = 0, ax = 0, ay = 0, sy = 0;
  const pt = (e) => { let x = 0, y = 0; for (const t of e.touches) { x += t.clientX; y += t.clientY; } return { x: x / e.touches.length, y: y / e.touches.length }; };
  setInterval(() => {
    if (ax || ay) { send({ type: 'move', dx: ax, dy: ay }); ax = ay = 0; }
    if (sy) { send({ type: 'scroll', dy: sy }); sy = 0; }
  }, 30);
  pad.addEventListener('touchstart', (e) => { e.preventDefault(); if (!last) { t0 = Date.now(); moved = 0; maxFingers = 0; } maxFingers = Math.max(maxFingers, e.touches.length); last = pt(e); }, { passive: false });
  pad.addEventListener('touchmove', (e) => {
    e.preventDefault(); const p = pt(e); const dx = p.x - last.x, dy = p.y - last.y; last = p; moved += Math.abs(dx) + Math.abs(dy);
    if (e.touches.length >= 2) sy += -dy * 3; else { ax += dx * 2.4; ay += dy * 2.4; }
  }, { passive: false });
  pad.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (e.touches.length) { last = pt(e); return; }
    if (moved < 12 && Date.now() - t0 < 350 && maxFingers === 1) send({ type: 'click' });
    last = null;
  }, { passive: false });
})();

// ---- Botones ----
$$('[data-nav]').forEach((b) => b.onclick = () => send({ type: 'nav', action: b.dataset.nav }));
$$('[data-seek]').forEach((b) => b.onclick = () => send({ type: 'media', action: 'seek', value: Number(b.dataset.seek) }));
$$('[data-speed]').forEach((b) => b.onclick = () => send({ type: 'media', action: 'speed', value: Number(b.dataset.speed) }));
$$('[data-vol]').forEach((b) => b.onclick = () => send({ type: 'volume', dir: b.dataset.vol }));
$$('[data-key]').forEach((b) => b.onclick = () => send({ type: 'key', key: b.dataset.key }));
$('#pp').onclick = () => send({ type: 'media', action: 'toggle' });
$('#mute').onclick = () => send({ type: 'media', action: 'mute' });
$('#fs').onclick = () => send({ type: 'media', action: 'fullscreen' });
$('#sendtxt').onclick = () => { const t = $('#txt').value; if (t) { send({ type: 'text', text: t }); $('#txt').value = ''; } };
$('#desk').onclick = () => { desktop = !desktop; $('#desk').textContent = 'Modo escritorio: ' + (desktop ? 'sí' : 'no'); send({ type: 'ua', desktop }); };
$('#addcur').onclick = () => { if (state.url) { send({ type: 'lib:add', title: state.title || state.url, url: state.url }); toast('Guardada en la biblioteca'); } };

const seek = $('#seek');
seek.addEventListener('input', () => { seeking = true; $('#tpos').textContent = fmt(seek.value); });
seek.addEventListener('change', () => { send({ type: 'media', action: 'seekto', value: Number(seek.value) }); setTimeout(() => seeking = false, 600); });

function renderState() {
  const s = state || {};
  $('#info').innerHTML = s.url ? `<b>${esc(s.title || '')}</b><br>${esc(s.url)}${s.has ? `<br>${s.paused ? '⏸' : '▶'} ${fmt(s.pos)} / ${fmt(s.dur)}` : ''}` : 'Sin datos de la TV';
  if (!seeking) { seek.max = Math.max(1, Math.floor(s.dur || 0)); seek.value = Math.floor(s.pos || 0); $('#tpos').textContent = fmt(s.pos); }
  $('#tdur').textContent = fmt(s.dur);
  $('#pp').textContent = s.has && !s.paused ? '⏸' : '▶';
}

// ---- Biblioteca ----
function renderLib() {
  $('#list').innerHTML = lib.length ? '' : '<p style="color:var(--mut)">Aún no hay clases guardadas.</p>';
  lib.forEach((i) => {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `<button class="t">${esc(i.title)}<small>${esc(i.url)}</small></button><button class="x" aria-label="Borrar">✕</button>`;
    d.querySelector('.t').onclick = () => openUrl(i.url);
    d.querySelector('.x').onclick = () => { if (confirm('¿Borrar "' + i.title + '"?')) send({ type: 'lib:del', id: i.id }); };
    $('#list').appendChild(d);
  });
}
$('#ladd').onclick = () => {
  const url = $('#lurl').value.trim(); if (!url) return;
  send({ type: 'lib:add', title: $('#ltitle').value.trim() || url, url });
  $('#ltitle').value = $('#lurl').value = '';
};

// ---- "Compartir → TV Control" (PWA instalada) ----
(() => {
  const p = new URLSearchParams(location.search);
  const raw = [p.get('url'), p.get('text'), p.get('title')].filter(Boolean).join(' ');
  const m = raw.match(/https?:\/\/\S+/);
  if (m) { pending = { type: 'open', url: m[0] }; history.replaceState(null, '', '/'); toast('Enviando a la TV…'); }
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
connect();
</script>
</body>
</html>
