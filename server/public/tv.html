<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@300;500&display=swap">
<style>
  :root{--bg:#161616;--card:#232220;--line:#33312D;--fg:#F2EFE9;--mut:#9A958C;--acc:#FF5B1F}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
  body{box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:6vh 6vw}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:2.2vh;letter-spacing:.16em}
  .top .brand{color:var(--mut)}
  .pill{display:flex;align-items:center;gap:1.2vh;background:var(--card);border-radius:1.4vh;padding:1.2vh 2vh}
  .dot{width:1.3vh;height:1.3vh;border-radius:50%;background:#6b6760}
  .pill.on .dot{background:var(--acc)}
  .mid{display:flex;align-items:flex-end;justify-content:space-between}
  #date{font-size:2.6vh;letter-spacing:.16em;color:var(--mut);margin-bottom:1.6vh;text-transform:uppercase}
  #clock{font-size:26vh;font-weight:300;letter-spacing:-.04em;line-height:.9;font-variant-numeric:tabular-nums}
  .knob{width:38vh;height:38vh;border-radius:50%;background:var(--card);box-shadow:inset 0 .6vh 2vh rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  .knob div{width:21vh;height:21vh;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 2vh 5vh rgba(255,91,31,.35)}
  .knob svg{width:8vh;height:8vh;fill:#161616;margin-left:1vh}
  .bottom{border-top:1px solid var(--line);padding-top:3.4vh;font-size:4.6vh;font-weight:600}
</style></head>
<body>
  <div class="top mono">
    <span class="brand">TV CONTROL</span>
    <span id="status" class="pill"><span class="dot"></span><span id="stxt">CONECTANDO…</span></span>
  </div>
  <div class="mid">
    <div><div id="date" class="mono"></div><div id="clock" class="mono">--:--</div></div>
    <div class="knob" aria-hidden="true"><div><svg viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg></div></div>
  </div>
  <div class="bottom">Lista para reproducir</div>
<script>
  function tick(){
    var d=new Date();
    var h=d.getHours()%12||12, m=String(d.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent=h+':'+m;
    document.getElementById('date').textContent=d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}).replace(',',' ·');
  }
  tick(); setInterval(tick,5000);
  // La app de la TV llama a esto cuando cambia la conexión con el servidor.
  window.setTvStatus=function(on){
    document.getElementById('status').classList.toggle('on',!!on);
    document.getElementById('stxt').textContent=on?'CONECTADA':'SIN CONEXIÓN';
  };
</script>
</body></html>
